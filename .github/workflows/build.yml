name: Build Zabbatha Standalone EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil pillow pyinstaller

    - name: Run Automated Tests
      run: |
        python -m unittest tests/test_zabbatha.py

    - name: Build Standalone Executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Zabbatha" --clean run.py

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zabbatha-Windows-x64
        path: dist/Zabbatha.exe
